name: CI

on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: go vet ./...

      - name: Test
        run: go test ./...
