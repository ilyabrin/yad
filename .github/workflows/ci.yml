name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref — saves minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: "latest" means a new linter release can turn CI red with
          # no change of ours, which is exactly what happened with 2.13.2.
          version: v2.13.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test (race + coverage)
        # PowerShell, the default shell on Windows runners, splits the
        # unquoted -coverprofile=coverage.out into two arguments and go test
        # then fails on a package called ".out". Use one shell everywhere.
        shell: bash
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Test on 32-bit
        # Sizes from the API exceed 2^31; this catches code that would
        # overflow int on 386 and 32-bit ARM. Runs natively on x86 Linux.
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null .

  build-more:
    # The other release targets, in one job to save runner minutes.
    name: Build (other platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          targets="
            windows/arm64
            linux/386 linux/arm/6 linux/arm/7 linux/riscv64
            freebsd/amd64 freebsd/arm64
            openbsd/amd64 openbsd/arm64
            netbsd/amd64
            android/arm64
          "
          for target in $targets; do
            IFS=/ read -r goos goarch goarm <<< "$target"
            echo "::group::$target"
            GOOS=$goos GOARCH=$goarch GOARM=$goarm go build -trimpath -ldflags "-s -w" -o /dev/null .
            echo "::endgroup::"
          done
