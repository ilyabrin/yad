
# Yandex Disk CLI tool config
# update with: yad config set [ language RU | token ENV_VAR]

---
# configuration file version number
version: 1

# the language for the CLI interface
language: RU # [ EN ]

# the name of the environment variable where the token is stored
accounts:
    - name: home
      access_token: HOME_YANDEX_DISK_ACCESS_TOKEN
    - name: work
      access_token: WORK_YANDEX_DISK_ACCESS_TOKEN

# TODO: default in nothing - raw ouptut
# [ json | csv | table ]
# format: table # default
