cli.help: |-
  yad: Яндекс.Диск в терминале

  Запуск:
    yad [флаг]

  Флаги:
    -v, --version   показать версию и выйти
    -h, --help      показать эту справку и выйти

  Настройки:
    ~/.yad/config.yaml   токены и настройки интерфейса

  Переменные окружения:
    YANDEX_DISK_TOKEN   токен вместо сохранённого (для CI и скриптов)
    YAD_LANG            язык интерфейса на этот запуск: ru или en (иначе
                        "language:" из настроек или язык системы)

  Клавиши (внутри программы):
    ↑/k  ↓/j           перемещение        u  загрузить файл
    ↵/→/l              открыть папку      U  загрузить по ссылке
    ←/h/Backspace      наверх             d  скачать
    Пробел             выделить           D  удалить
    Ctrl+A             выделить всё       n  новая папка
    /                  фильтр по имени    r  переименовать
    Esc                сбросить фильтр    s  сортировка
    m                  о файле            R  обновить
    p                  поделиться         i  о Диске
    c                  копировать ссылку  t  корзина
    o                  открыть ссылку     q  выход

  Исходный код: https://github.com/ilyabrin/yad
