version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: yad
    binary: yad
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/ilyabrin/yad/internal/auth.clientSecret={{ .Env.YANDEX_CLIENT_SECRET }}

archives:
  - id: yad
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - README.ru.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"
      - "^build(deps):"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ilyabrin
    name: yad
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
