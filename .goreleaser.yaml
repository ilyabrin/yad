version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: yad
    binary: yad
    main: .
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - linux_386
      - linux_arm_6
      - linux_arm_7
      - linux_riscv64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - freebsd_amd64
      - freebsd_arm64
      - openbsd_amd64
      - openbsd_arm64
      - netbsd_amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: yad
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - README.ru.md
      - LICENSE-MIT
      - LICENSE-APACHE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"
      - "^build(deps):"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ilyabrin
    name: yad
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
